[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devflow"
# ops/release.sh setzt hier die Version des Releases (v2.N → 2.N)
version = "2.3"
description = "devflow 2: Werkzeug für Code, gesteuert von einer KI per MCP"
readme = "README.md"
license = { file = "LICENSE" }
# Python 3.11 über uv, siehe .python-version
requires-python = ">=3.11,<3.12"
# Die Pins stehen mit allen Folgepaketen in requirements.txt (dort ist die feste Liste)
dependencies = [
    "mcp==1.30.0",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[tool.setuptools]
packages = ["devflow2"]

[tool.setuptools.package-data]
devflow2 = ["static/**/*"]
